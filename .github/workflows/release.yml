name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          pip install -e ".[desktop]" pyinstaller
          pyinstaller --noconfirm --onefile --windowed --icon ../docs/logo.ico --name LapAnalyzer `
            --add-data "../frontend/dist;frontend_dist" `
            --collect-submodules uvicorn `
            launch_desktop.py
      - name: Upload unsigned exe
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: LapAnalyzer-unsigned
          path: backend/dist/LapAnalyzer.exe
      - name: Sign exe with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: iracing-lap-analyzer
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: softprops/action-gh-release@v2
        with:
          files: signed/LapAnalyzer.exe
          generate_release_notes: true
