[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lap-analyzer"
version = "0.1.0"
description = "Compare iRacing laps corner by corner from .ibt telemetry."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "pyinstaller>=6"]

[tool.setuptools.packages.find]
include = ["lap_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lap_analyzer"]
branch = true

[tool.coverage.report]
# Aim for 100%; the build fails below 95%.
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
