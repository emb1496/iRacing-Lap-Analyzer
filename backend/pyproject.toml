[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lap-analyzer"
version = "0.1.0"
description = "Compare iRacing laps corner by corner from .ibt telemetry."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "pyinstaller>=6"]

[tool.setuptools.packages.find]
include = ["lap_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: launches the real server; run with `pytest tests_integration`"]

[tool.coverage.run]
source = ["lap_analyzer"]
branch = true
parallel = true  # server subprocesses write their own data files; `coverage combine` merges them
sigterm = true  # flush data when a server subprocess is terminated

[tool.coverage.paths]
# Servers started from a copy of the package (to test a missing frontend build) report there.
source = ["lap_analyzer", "*/lap_analyzer"]

[tool.coverage.report]
# The build fails below 100%.
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
